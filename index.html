<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Writer - äºç«¯åä½</title>
<style>
:root{
  --bg:#faf9f6; --text:#333; --border:#e0dcd4; --accent:#d4a574;
  --status-bg:#f0ede6; --input-bg:#fff; --shadow:rgba(0,0,0,0.06);
}
.dark{
  --bg:#1e1e1e; --text:#d4d4d4; --border:#3c3c3c; --accent:#c8945a;
  --status-bg:#2a2a2a; --input-bg:#2d2d2d; --shadow:rgba(0,0,0,0.3);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font:16px/1.8 'Georgia','Noto Serif SC',serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
#app{max-width:720px;margin:0 auto;padding:20px 16px 60px}

/* Toolbar */
#toolbar{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
#toolbar button{background:none;border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:4px;font-size:13px;cursor:pointer;transition:all .2s}
#toolbar button:hover{border-color:var(--accent);color:var(--accent)}
#saveStatus{font-size:12px;color:#999;margin-left:auto;white-space:nowrap}
#saveStatus.saving{color:#c8945a}
#saveStatus.saved{color:#6a9}
#saveStatus.error{color:#d66}
#wordCount{font-size:12px;color:#999}

/* Title */
#title{width:100%;font:bold 28px/1.4 'Georgia','Noto Serif SC',serif;border:none;outline:none;background:transparent;color:var(--text);padding:8px 0;margin-bottom:16px;resize:none}
#title::placeholder{color:#bbb}

/* Editor */
#editor{width:100%;min-height:50vh;border:none;outline:none;background:transparent;color:var(--text);font:16px/1.8 'Georgia','Noto Serif SC',serif;resize:none;overflow-y:hidden}
#editor::placeholder{color:#ccc}

/* Settings Panel */
#settingsOverlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:center}
#settingsOverlay.show{display:flex}
#settingsPanel{background:var(--input-bg);padding:24px;border-radius:8px;width:92%;max-width:480px;box-shadow:0 8px 32px var(--shadow)}
#settingsPanel h3{font-size:18px;margin-bottom:16px;color:var(--accent)}
#settingsPanel label{display:block;font-size:13px;color:#999;margin:10px 0 4px}
#settingsPanel input,#settingsPanel select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:14px}
#settingsPanel .btns{display:flex;gap:8px;margin-top:20px}
#settingsPanel button{flex:1;padding:10px;border-radius:4px;font-size:14px;cursor:pointer;border:none}
#settingsPanel .btnPrimary{background:var(--accent);color:#fff}
#settingsPanel .btnCancel{background:var(--border);color:var(--text)}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:6px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

@media(max-width:600px){
  #app{padding:12px 10px 40px}
  #title{font-size:22px}
  #editor{font-size:15px}
}
</style>
</head>
<body>

<div id="app">
  <div id="toolbar">
    <button onclick="openSettings()" title="è®¾ç½®">â è®¾ç½®</button>
    <button onclick="toggleTheme()" title="ä¸»é¢">ð</button>
    <button onclick="loadRemote()" title="ä»äºç«¯æå">â æå</button>
    <button onclick="saveRemote()" title="ä¿å­å°äºç«¯">ð¾ ä¿å­</button>
    <span id="wordCount">0 å­</span>
    <span id="saveStatus"></span>
  </div>
  <textarea id="title" placeholder="æ é¢..." rows="1"></textarea>
  <textarea id="editor" placeholder="å¼å§åä½..." rows="20"></textarea>
</div>

<div id="settingsOverlay">
  <div id="settingsPanel">
    <h3>GitHub éç½®</h3>
    <label>GitHub Token</label>
    <input id="cfgToken" type="password" placeholder="ghp_xxx...">
    <label>ä»åºææè</label>
    <input id="cfgOwner" placeholder="wangyongshun199910">
    <label>ä»åºå</label>
    <input id="cfgRepo" placeholder="writer">
    <label>åæ¯</label>
    <input id="cfgBranch" value="main">
    <label>æä»¶è·¯å¾</label>
    <input id="cfgPath" placeholder="novel.md">
    <div class="btns">
      <button class="btnCancel" onclick="closeSettings()">åæ¶</button>
      <button class="btnPrimary" onclick="saveSettings()">ä¿å­éç½®</button>
    </div>
    <div style="margin-top:12px;font-size:12px;color:#999;text-align:center">
      Token éè¦ <code>repo</code> æé | <a href="https://github.com/settings/tokens/new" target="_blank" style="color:var(--accent)">åå»º Token</a>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ===== State =====
let saveTimer = null;
let lastSavedContent = '';
let lastSavedTitle = '';
let dirty = false;

// ===== Settings =====
function getConfig(){
  try{
    return JSON.parse(localStorage.getItem('writer_config')||'{}');
  }catch(e){return{}}
}
function setConfig(c){
  localStorage.setItem('writer_config',JSON.stringify(c));
  // hide token from UI display
  document.getElementById('cfgToken').value = c.token||'';
  document.getElementById('cfgOwner').value = c.owner||'';
  document.getElementById('cfgRepo').value = c.repo||'';
  document.getElementById('cfgBranch').value = c.branch||'main';
  document.getElementById('cfgPath').value = c.path||'novel.md';
}

// ===== UI =====
function openSettings(){
  let c = getConfig();
  setConfig(c);
  document.getElementById('settingsOverlay').classList.add('show');
}
function closeSettings(){
  document.getElementById('settingsOverlay').classList.remove('show');
}
function saveSettings(){
  let c = {
    token: document.getElementById('cfgToken').value.trim(),
    owner: document.getElementById('cfgOwner').value.trim(),
    repo: document.getElementById('cfgRepo').value.trim(),
    branch: document.getElementById('cfgBranch').value.trim()||'main',
    path: document.getElementById('cfgPath').value.trim()||'novel.md'
  };
  setConfig(c);
  closeSettings();
  toast('éç½®å·²ä¿å­');
}

function toggleTheme(){
  document.body.classList.toggle('dark');
  localStorage.setItem('writer_dark', document.body.classList.contains('dark'));
}

function toast(msg, ms=2000){
  let t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), ms);
}

function setStatus(text, cls){
  let s = document.getElementById('saveStatus');
  s.textContent = text;
  s.className = cls||'';
}

// ===== GitHub API =====
async function githubAPI(method, url, body){
  let cfg = getConfig();
  if(!cfg.token || !cfg.owner || !cfg.repo){
    toast('è¯·åéç½® GitHub Token åä»åºä¿¡æ¯');
    throw new Error('æªéç½®');
  }
  let api = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
  let headers = {
    'Authorization': 'Bearer ' + cfg.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
  let opts = { method, headers };
  if(body){
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }

  let resp = await fetch(api, opts);
  if(!resp.ok){
    let err = await resp.json().catch(()=>({}));
    throw new Error(err.message || `HTTP ${resp.status}`);
  }
  return resp.json();
}

// ===== Save =====
async function saveRemote(){
  let title = document.getElementById('title').value.trim();
  let content = document.getElementById('editor').value;

  if(!title && !content){
    toast('åå®¹ä¸ºç©ºï¼æ éä¿å­');
    return;
  }

  let text = '';
  if(title) text += '# ' + title + '\n\n';
  text += content;

  setStatus('ä¿å­ä¸­...', 'saving');

  try{
    let cfg = getConfig();
    let content_b64 = btoa(unescape(encodeURIComponent(text)));

    // get current file sha
    let sha = null;
    try{
      let existing = await githubAPI('GET');
      sha = existing.sha;
    }catch(e){
      // file doesn't exist yet
    }

    let body = {
      message: 'Update ' + cfg.path,
      content: content_b64,
      branch: cfg.branch
    };
    if(sha) body.sha = sha;

    await githubAPI('PUT', null, body);
    lastSavedContent = content;
    lastSavedTitle = title;
    dirty = false;
    setStatus('â å·²ä¿å­', 'saved');
    toast('å·²ä¿å­å° GitHub');
    setTimeout(()=>setStatus(''), 3000);
  }catch(e){
    setStatus('ä¿å­å¤±è´¥', 'error');
    toast('ä¿å­å¤±è´¥: ' + e.message, 3000);
  }
}

// ===== Load =====
async function loadRemote(){
  setStatus('å è½½ä¸­...', 'saving');
  try{
    let data = await githubAPI('GET');
    let text = decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));
    let title = '';
    let content = text;
    let m = text.match(/^#\s+(.+?)\n+/);
    if(m){
      title = m[1];
      content = text.substring(m[0].length);
    }
    document.getElementById('title').value = title;
    document.getElementById('editor').value = content;
    lastSavedTitle = title;
    lastSavedContent = content;
    dirty = false;
    autoResize();
    updateWordCount();
    setStatus('â å·²å è½½', 'saved');
    toast('å·²ä» GitHub å è½½');
    setTimeout(()=>setStatus(''), 3000);
  }catch(e){
    setStatus('å è½½å¤±è´¥', 'error');
    toast('å è½½å¤±è´¥: ' + e.message, 3000);
  }
}

// ===== Auto Save =====
function onContentChange(){
  updateWordCount();
  dirty = true;
  setStatus('â æªä¿å­', '');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(autoSave, 3000);
}

async function autoSave(){
  if(!dirty) return;
  let title = document.getElementById('title').value;
  let content = document.getElementById('editor').value;
  if(title === lastSavedTitle && content === lastSavedContent) return;

  setStatus('èªå¨ä¿å­...', 'saving');
  try{
    let cfg = getConfig();
    if(!cfg.token) { setStatus(''); return; }

    let text = '';
    if(title) text += '# ' + title + '\n\n';
    text += content;
    let content_b64 = btoa(unescape(encodeURIComponent(text)));

    let sha = null;
    try{
      let existing = await githubAPI('GET');
      sha = existing.sha;
    }catch(e){}

    let body = {
      message: 'Auto-save ' + cfg.path,
      content: content_b64,
      branch: cfg.branch
    };
    if(sha) body.sha = sha;

    await githubAPI('PUT', null, body);
    lastSavedContent = content;
    lastSavedTitle = title;
    dirty = false;
    setStatus('â å·²ä¿å­', 'saved');
    setTimeout(()=>setStatus(''), 3000);
  }catch(e){
    setStatus('ä¿å­å¤±è´¥', 'error');
  }
}

// ===== Word Count =====
function updateWordCount(){
  let text = document.getElementById('editor').value;
  let cn = (text.match(/[\u4e00-\u9fff]/g)||[]).length;
  let en = (text.match(/[a-zA-Z]+/g)||[]).length;
  document.getElementById('wordCount').textContent = (cn+en) + ' å­';
}

// ===== Auto Resize =====
function autoResize(){
  let el = document.getElementById('editor');
  el.style.height = 'auto';
  el.style.height = Math.max(el.scrollHeight, window.innerHeight*0.5) + 'px';
}

// ===== Init =====
document.getElementById('title').addEventListener('input', onContentChange);
document.getElementById('editor').addEventListener('input', function(){
  onContentChange();
  autoResize();
});

// Keyboard shortcut: Ctrl+S to save
document.addEventListener('keydown', function(e){
  if((e.ctrlKey||e.metaKey) && e.key==='s'){
    e.preventDefault();
    saveRemote();
  }
});

// Load dark theme preference
if(localStorage.getItem('writer_dark')==='true'){
  document.body.classList.add('dark');
}

// Init config display
let c = getConfig();
if(c.token) document.getElementById('cfgToken').value = c.token;
if(c.owner) document.getElementById('cfgOwner').value = c.owner;
if(c.repo) document.getElementById('cfgRepo').value = c.repo;
if(c.branch) document.getElementById('cfgBranch').value = c.branch;
if(c.path) document.getElementById('cfgPath').value = c.path;

updateWordCount();
autoResize();

// Auto-load if configured
if(c.token && c.owner && c.repo){
  loadRemote().catch(()=>{});
}
</script>
</body>
</html>
