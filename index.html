<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Writer - 云端写作</title>
<style>
:root{
  --bg:#faf9f6; --text:#333; --border:#e0dcd4; --accent:#d4a574;
  --status-bg:#f0ede6; --input-bg:#fff; --shadow:rgba(0,0,0,0.06);
}
.dark{
  --bg:#1e1e1e; --text:#d4d4d4; --border:#3c3c3c; --accent:#c8945a;
  --status-bg:#2a2a2a; --input-bg:#2d2d2d; --shadow:rgba(0,0,0,0.3);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font:16px/1.8 'Georgia','Noto Serif SC',serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
body.zoom-locked{touch-action:pan-x pan-y;overscroll-behavior:none}

/* Login overlay */
#loginOverlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
#loginCard{background:var(--input-bg);border:1px solid var(--border);border-radius:12px;padding:36px 28px;width:90%;max-width:360px;text-align:center;box-shadow:0 4px 24px var(--shadow)}
#loginCard h1{font:bold 26px 'Georgia',serif;color:var(--accent);margin-bottom:6px;letter-spacing:2px}
#loginCard p.desc{font-size:13px;color:#999;margin-bottom:24px}
#loginCard input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-size:16px;background:var(--bg);color:var(--text);outline:none;text-align:center;letter-spacing:4px;transition:border .2s}
#loginCard input:focus{border-color:var(--accent)}
#loginCard button{width:100%;padding:11px;margin-top:14px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;font-weight:bold;cursor:pointer;transition:opacity .2s}
#loginCard button:active{opacity:.8}
#loginError{color:#d66;font-size:13px;margin-top:10px;min-height:20px}

/* Editor */
#app{max-width:720px;margin:0 auto;padding:20px 16px 120px;display:none}

#topbar{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:12px;flex-wrap:wrap}
#topbar .sep{flex:1}
#btnTheme{background:none;border:none;font-size:20px;cursor:pointer;padding:0 4px;line-height:1}
#chapterLabel{font-size:13px;color:var(--accent);font-weight:bold;white-space:nowrap}
#saveStatus{font-size:12px;color:#999;white-space:nowrap;margin-left:auto}
#saveStatus.saving{color:#c8945a}
#saveStatus.saved{color:#6a9}
#saveStatus.error{color:#d66}
#wordCount{font-size:12px;color:#999;white-space:nowrap}

#chTitleInput{width:100%;font:bold 24px/1.4 'Georgia','Noto Serif SC',serif;border:none;outline:none;background:transparent;color:var(--text);padding:4px 0;margin-bottom:10px;resize:none}
#chTitleInput::placeholder{color:#bbb}

#editor{width:100%;min-height:50vh;border:none;outline:none;background:transparent;color:var(--text);font-size:16px;line-height:1.8;font-family:'Georgia','Noto Serif SC',serif;resize:none;overflow-y:hidden}
#editor::placeholder{color:#ccc}

/* Bottom bar */
#bottombar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;gap:6px;z-index:50}
#bottombar button{flex:1;padding:8px 4px;border:none;border-radius:6px;font-size:13px;cursor:pointer;transition:all .2s;max-width:80px;background:var(--border);color:var(--text)}
#bottombar button.accent{background:var(--accent);color:#fff}
#bottombar button:active{opacity:.8}
#bottombar button.locked{background:#6a9;color:#fff}
#bottomStatus{font-size:11px;color:#999;margin-left:auto;margin-right:4px;white-space:nowrap}
#bottomStatus.saving{color:#c8945a}
#bottomStatus.saved{color:#6a9}
#bottomStatus.error{color:#d66}
#chIndicator{font-size:11px;color:var(--accent);margin-right:6px;white-space:nowrap}

#fontPopup{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:12px 18px;display:none;z-index:60;gap:10px;align-items:center;box-shadow:0 4px 16px var(--shadow)}
#fontPopup input[type=range]{width:120px}
#fontPopup span{font-size:13px;color:var(--text);min-width:40px;text-align:center}

/* Floating note button */
#noteFab{position:fixed;right:16px;bottom:80px;height:50px;padding:0 20px;border-radius:25px;background:var(--accent);color:#fff;font-size:16px;font-weight:bold;display:flex;align-items:center;gap:6px;cursor:pointer;z-index:60;box-shadow:0 3px 14px rgba(0,0,0,0.25);border:none;transition:transform .15s}
#noteFab:active{transform:scale(.94)}

/* Quick input fab */
#quickInputFab{position:fixed;right:16px;bottom:145px;height:44px;padding:0 18px;border-radius:22px;background:var(--accent);color:#fff;font-size:15px;font-weight:bold;display:flex;align-items:center;gap:5px;cursor:pointer;z-index:60;box-shadow:0 3px 14px rgba(0,0,0,0.25);border:none;transition:transform .15s}
#quickInputFab:active{transform:scale(.94)}
#quickInputPanel{position:fixed;right:16px;bottom:200px;width:300px;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:10px;display:none;flex-direction:column;gap:8px;z-index:70;box-shadow:0 4px 20px var(--shadow)}
#quickInputPanel.open{display:flex}
#quickInput{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font:14px/1.6 'Georgia','Noto Serif SC',serif;outline:none;background:var(--bg);color:var(--text)}
#quickInput:focus{border-color:var(--accent)}
#quickInputPanel .hint{font-size:11px;color:#999;text-align:right}

/* Note panel */
#notePanel{position:fixed;inset:0;background:var(--bg);z-index:80;display:none;flex-direction:column;padding:16px}
#notePanel.open{display:flex}
#noteHeader{display:flex;align-items:center;gap:10px;padding:4px 0 12px;border-bottom:1px solid var(--border)}
#noteHeader .title{font:bold 18px 'Georgia',serif;color:var(--accent);flex:1}
#noteHeader button{background:var(--border);border:none;color:var(--text);padding:6px 14px;border-radius:6px;font-size:14px;cursor:pointer}
#noteHeader button.accent{background:var(--accent);color:#fff}
#noteHeader button:active{opacity:.8}
#noteSaveStatus{font-size:12px;color:#999;margin-left:auto}
#noteSaveStatus.saving{color:#c8945a}
#noteSaveStatus.saved{color:#6a9}
#noteSaveStatus.error{color:#d66}

#noteList{display:flex;gap:8px;overflow-x:auto;padding:12px 0;flex-wrap:nowrap}
#noteList::-webkit-scrollbar{height:4px}
#noteList::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.noteChip{flex:0 0 auto;padding:6px 14px;border:1px solid var(--border);border-radius:16px;font-size:13px;cursor:pointer;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;color:var(--text);transition:all .15s}
.noteChip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

#noteTitle{width:100%;font:bold 18px/1.4 'Georgia','Noto Serif SC',serif;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);padding:8px 12px;margin-bottom:10px;outline:none}
#noteTitle::placeholder{color:#bbb}
#noteContent{flex:1;width:100%;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);padding:12px;font:15px/1.7 'Georgia','Noto Serif SC',serif;outline:none;resize:none;min-height:40vh}
#noteContent::placeholder{color:#ccc}

#noteFooter{display:flex;gap:10px;padding-top:12px}
#noteFooter button{flex:1;padding:10px;border:none;border-radius:6px;font-size:14px;cursor:pointer}
#btnNoteDelete{background:var(--border);color:var(--text)}
#btnNoteSave{background:var(--accent);color:#fff;font-weight:bold}
#noteFooter button:active{opacity:.8}

@media(min-width:768px){
  #bottombar{left:50%;right:auto;transform:translateX(-50%);width:720px;border-radius:8px 8px 0 0;padding:8px 16px}
  #notePanel{left:50%;right:auto;transform:translateX(-50%);width:520px;max-width:100vw;border-radius:12px 12px 0 0;box-shadow:0 -4px 24px var(--shadow)}
}

/* Desktop note sidebar */
#noteSidebar{position:fixed;top:0;right:0;bottom:0;width:320px;background:var(--bg);border-left:1px solid var(--border);z-index:50;padding:16px;overflow-y:auto;display:none;flex-direction:column}
#sideHeader{display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px}
#sideHeader .title{font:bold 17px 'Georgia',serif;color:var(--accent);flex:1}
#sideHeader button{background:var(--border);border:none;color:var(--text);padding:5px 12px;border-radius:6px;font-size:13px;cursor:pointer}
#sideHeader button.accent{background:var(--accent);color:#fff}
#sideHeader button:active{opacity:.8}
#sideNoteStatus{font-size:11px;color:#999}
#sideNoteStatus.saving{color:#c8945a}
#sideNoteStatus.saved{color:#6a9}
#sideNoteStatus.error{color:#d66}
#sideNoteList{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;overflow-y:auto;max-height:45vh;flex-shrink:0}
.sideChip{padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .15s}
#sideAddBtn{width:100%;padding:8px;margin-bottom:10px;border:1px dashed var(--border);border-radius:8px;background:transparent;color:var(--accent);font-size:14px;cursor:pointer;transition:all .15s}
#sideAddBtn:hover{border-color:var(--accent)}
#sideEditor{display:none;flex-direction:column;flex:1;min-height:0}
.sideChip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#sideNoteTitle{width:100%;font:bold 16px/1.4 'Georgia','Noto Serif SC',serif;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);padding:7px 10px;margin-bottom:8px;outline:none}
#sideNoteTitle::placeholder{color:#bbb}
#sideNoteContent{flex:1;width:100%;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);padding:10px;font:14px/1.7 'Georgia','Noto Serif SC',serif;outline:none;resize:none;min-height:30vh}
#sideNoteContent::placeholder{color:#ccc}
#sideFooter{display:flex;gap:8px;padding-top:10px}
#sideFooter button{flex:1;padding:8px;border:none;border-radius:6px;font-size:13px;cursor:pointer}
#sideNoteDelete{background:var(--border);color:var(--text)}
#sideNoteSave{background:var(--accent);color:#fff;font-weight:bold}
#sideFooter button:active{opacity:.8}

/* Desktop layout: hide fab, show sidebar */
body.note-desktop #noteFab{display:none}
body.note-desktop #noteSidebar{display:flex}
body.note-desktop #app{margin-right:320px}
body.note-desktop #bottombar{left:0;right:320px;transform:none;width:auto;border-radius:0}

/* Sidebar collapse/expand */
#sideCollapseBtn{padding:4px 10px;font-size:15px;line-height:1}
#sideExpandFab{position:fixed;right:0;top:50%;transform:translateY(-50%);padding:14px 8px;background:var(--accent);color:#fff;font-size:13px;border:none;border-radius:8px 0 0 8px;cursor:pointer;display:none;z-index:60;letter-spacing:2px;writing-mode:vertical-rl;box-shadow:0 3px 12px rgba(0,0,0,0.2)}
body.note-desktop.side-collapsed #noteSidebar{display:none}
body.note-desktop.side-collapsed #app{margin-right:0}
body.note-desktop.side-collapsed #bottombar{left:0;right:0}
body.note-desktop.side-collapsed #sideExpandFab{display:block}

.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* ===== 瑞鹤图背景（仅 PC 端显示，手机端隐藏） ===== */
#bgLayer{position:fixed;inset:0;z-index:0;background:url('assets/background.jpg') no-repeat center/cover;display:none;pointer-events:none}
#bgLayer::after{content:"";position:absolute;inset:0;background:rgba(250,249,246,0.55)}
.dark #bgLayer::after{background:rgba(30,30,30,0.55)}
/* 内容浮层半透明以露出背景 */
@media(min-width:769px){
  #bgLayer{display:block}
  #loginOverlay{background:rgba(250,249,246,0.6)}
  .dark #loginOverlay{background:rgba(30,30,30,0.6)}
  #bottombar{background:rgba(250,249,246,0.85)}
  .dark #bottombar{background:rgba(30,30,30,0.85)}
}
</style>
</head>
<body>

<!-- 瑞鹤图背景层（仅PC） -->
<div id="bgLayer"></div>

<div id="loginOverlay">
  <div id="loginCard">
    <h1>Writer</h1>
    <p class="desc">云端写作 · 私人空间</p>
    <input type="password" id="pwInput" placeholder="输入密码" autocomplete="off">
    <button id="loginBtn">进入</button>
    <p id="loginError"></p>
  </div>
</div>

<div id="app">
  <div id="topbar">
    <button id="btnTheme" onclick="toggleTheme()" title="日/夜模式">🌓</button>
    <span id="chapterLabel"></span>
    <span class="sep"></span>
    <span id="saveStatus"></span>
    <span id="wordCount">0 字</span>
  </div>
  <textarea id="chTitleInput" placeholder="章节标题..." rows="1"></textarea>
  <textarea id="editor" placeholder="开始写作..." rows="20"></textarea>
</div>

<div id="bottombar">
  <button id="btnPrev" title="上一章">◀</button>
  <button id="btnNext" title="下一章">▶</button>
  <span id="chIndicator"></span>
  <span id="bottomStatus"></span>
  <button id="btnFont" onclick="toggleFontPopup()">A</button>
  <button id="btnLock" onclick="toggleZoomLock()">🔓</button>
  <button id="btnLoad" onclick="loadRemote()">拉取</button>
  <button id="btnSave" class="accent" onclick="forceSave()">保存</button>
</div>

<div id="fontPopup">
  <span>A-</span>
  <input type="range" id="fontSlider" min="12" max="28" value="16" step="1">
  <span>A+</span>
</div>

<!-- Floating note button -->
<button id="noteFab" onclick="toggleNotePanel()">📝 便签</button>

<!-- Quick input fab -->
<button id="quickInputFab" onclick="toggleQuickInput()">✎ 输入</button>
<div id="quickInputPanel">
  <input id="quickInput" placeholder="输入内容，回车插入正文" autocomplete="off">
  <div class="hint">回车 = 插入为一个段落 · Esc 关闭</div>
</div>

<!-- Note panel -->
<div id="notePanel">
  <div id="noteHeader">
    <span class="title">便签</span>
    <span id="noteSaveStatus"></span>
    <button id="btnNoteNew" class="accent" onclick="newNote()">+ 新增</button>
    <button id="btnNoteClose" onclick="toggleNotePanel()">✕</button>
  </div>
  <div id="noteList"></div>
  <input id="noteTitle" placeholder="便签标题（人物性格 / 故事情节 / 灵感）">
  <textarea id="noteContent" placeholder="记录你的灵感..."></textarea>
  <div id="noteFooter">
    <button id="btnNoteDelete" onclick="deleteNote()">删除</button>
    <button id="btnNoteSave" onclick="forceSaveNote()">保存</button>
  </div>
</div>

<!-- Desktop note sidebar -->
<div id="noteSidebar">
  <div id="sideHeader">
    <span class="title">便签</span>
    <span id="sideNoteStatus"></span>
    <button id="sideCollapseBtn" onclick="collapseSidebar()" title="隐藏便签栏">✕</button>
  </div>
  <div id="sideNoteList"></div>
  <button id="sideAddBtn" onclick="newNote()">+ 新增</button>
  <div id="sideEditor" style="display:none">
    <input id="sideNoteTitle" placeholder="标题（人物性格 / 故事情节 / 灵感）">
    <textarea id="sideNoteContent" placeholder="记录你的灵感..."></textarea>
    <div id="sideFooter">
      <button id="sideNoteDelete" onclick="deleteNote()">删除</button>
      <button id="sideNoteSave" onclick="forceSaveNote()">保存</button>
    </div>
  </div>
</div>

<!-- Sidebar expand fab (shown when sidebar collapsed) -->
<button id="sideExpandFab" onclick="expandSidebar()">便签</button>

<script>
// ============================================================
// Encrypted config (AES-256-GCM + PBKDF2-SHA256)
// ============================================================
var ENC={salt:"qWqf4hw7OfyWQiS1W1DHHQ==",iv:"L9ADvK1y4kz13L3v",enc:"UhE2Qz3lxTzoyExgy/xCD6VgO1xVrtUAROZFkigPXO8OnKlaVzCkMNALR5igtkXc2UPha3ULKzg=",iter:600000};
var PW_HASH="0a42b8f38c2c1b24ac890f9f72abb8a186160e9a7e909237a84734660154487b";

var CFG={owner:"wangyongshun199910",repo:"writer",branch:"main",path:"novel.md",token:""};
var NOTES_PATH="notes.md";
var saveTimer=null,lastFullContent=null,dirty=false,savingInProgress=false;
var chapters=[],chIdx=0;
var notes=[],noteIdx=0,noteSaving=false,noteTimer=null,lastNotesContent="";
var zoomLocked=false;

// ---- UTF-8 safe base64 ----
function utf8ToB64(str){
  var bytes=new TextEncoder().encode(str);
  var bin="";
  for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToUtf8(b64){
  var bin=atob(b64);
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// ---- Crypto ----
function b64ToBuf(b64){return Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0)}).buffer}
function bufToHex(buf){return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")}
async function sha256(text){var enc=new TextEncoder().encode(text);var hash=await crypto.subtle.digest("SHA-256",enc);return bufToHex(hash);}
async function decryptToken(password){
  var salt=b64ToBuf(ENC.salt),iv=b64ToBuf(ENC.iv),ct=b64ToBuf(ENC.enc);
  var pwEnc=new TextEncoder().encode(password);
  var keyMat=await crypto.subtle.importKey("raw",pwEnc,"PBKDF2",false,["deriveBits"]);
  var dk=await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:ENC.iter,hash:"SHA-256"},keyMat,256);
  var aesKey=await crypto.subtle.importKey("raw",dk,"AES-GCM",false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},aesKey,ct);
  return new TextDecoder().decode(pt);
}

// ---- Login ----
async function doLogin(){
  var pw=document.getElementById("pwInput").value;
  if(!pw){showError("请输入密码");return;}
  var hash=await sha256(pw);
  if(hash!==PW_HASH){showError("密码错误");return;}
  try{
    var token=await decryptToken(pw);
    CFG.token=token;
    sessionStorage.setItem("writer_token",token);
    enterEditor();
  }catch(e){showError("解密失败");console.error(e);}
}
function showError(msg){
  document.getElementById("loginError").textContent=msg;
  var card=document.getElementById("loginCard");
  card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake");
}
document.getElementById("loginBtn").addEventListener("click",doLogin);
document.getElementById("pwInput").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});

// ---- Chapter logic ----
function parseChapters(raw){
  if(!raw)return[{title:"",content:""}];
  var result=[];
  var lines=raw.split(/\n/);
  var buf=[],curTitle="";
  for(var i=0;i<lines.length;i++){
    var m=lines[i].match(/^##\s+(.+)/);
    if(m){
      if(buf.length>0||curTitle)result.push({title:curTitle,content:buf.join("\n").trim()});
      curTitle=m[1];buf=[];
    }else{buf.push(lines[i]);}
  }
  result.push({title:curTitle,content:buf.join("\n").trim()});
  if(result.length===1&&!result[0].title&&!result[0].content)return[{title:"",content:""}];
  return result;
}
function packChapters(){
  var parts=[];
  for(var i=0;i<chapters.length;i++){
    var ch=chapters[i];
    if(ch.title)parts.push("## "+ch.title);
    if(ch.content)parts.push(ch.content);
  }
  return parts.join("\n").trim()+"\n";
}
function saveCurChapter(){
  var title=document.getElementById("chTitleInput").value.trim();
  var content=document.getElementById("editor").value;
  if(!chapters[chIdx])chapters[chIdx]={title:"",content:""};
  chapters[chIdx]={title:title,content:content};
}
function loadChapter(idx){
  saveCurChapter();
  chIdx=Math.max(0,Math.min(idx,chapters.length-1));
  if(!chapters[chIdx])chapters[chIdx]={title:"",content:""};
  var ch=chapters[chIdx];
  document.getElementById("chTitleInput").value=ch.title||"";
  document.getElementById("editor").value=ch.content||"";
  updateChapterUI();autoResize();updateWordCount();
}
function newChapter(){
  saveCurChapter();
  chapters.push({title:"",content:""});
  chIdx=chapters.length-1;
  document.getElementById("chTitleInput").value="";
  document.getElementById("editor").value="";
  updateChapterUI();autoResize();updateWordCount();
  dirty=true;onChange();
}
function updateChapterUI(){
  var t=(chIdx+1)+"/"+chapters.length;
  document.getElementById("chIndicator").textContent=t;
  var ch=chapters[chIdx];
  document.getElementById("chapterLabel").textContent=ch&&ch.title?"第"+(chIdx+1)+"章 · "+ch.title:t;
  document.getElementById("btnPrev").style.opacity=chIdx===0?"0.3":"1";
  document.getElementById("btnNext").style.opacity=chIdx>=chapters.length-1?"0.3":"1";
}

// ---- Zoom Lock ----
function toggleZoomLock(){
  zoomLocked=!zoomLocked;
  var btn=document.getElementById("btnLock");
  if(zoomLocked){
    document.body.classList.add("zoom-locked");
    btn.textContent="🔒";btn.classList.add("locked");
    document.addEventListener("touchmove",preventPinch,{passive:false});
    document.addEventListener("gesturestart",preventGesture);
    document.addEventListener("gesturechange",preventGesture);
    document.addEventListener("gestureend",preventGesture);
  }else{
    document.body.classList.remove("zoom-locked");
    btn.textContent="🔓";btn.classList.remove("locked");
    document.removeEventListener("touchmove",preventPinch);
    document.removeEventListener("gesturestart",preventGesture);
    document.removeEventListener("gesturechange",preventGesture);
    document.removeEventListener("gestureend",preventGesture);
  }
  localStorage.setItem("writer_zoomLock",zoomLocked?"1":"0");
}
function preventPinch(e){if(e.touches&&e.touches.length>1)e.preventDefault();}
function preventGesture(e){e.preventDefault();}

// ---- Font size ----
function applyFontSize(v){
  document.getElementById("editor").style.fontSize=v+"px";
  document.getElementById("chTitleInput").style.fontSize=(parseInt(v)+8)+"px";
  document.getElementById("fontSlider").value=v;
  localStorage.setItem("writer_fontSize",v);
}
function toggleFontPopup(){
  var pop=document.getElementById("fontPopup");
  pop.style.display=pop.style.display==="flex"?"none":"flex";
}

// ---- GitHub API (path optional) ----
function api(method,body,path){
  var p=path||CFG.path;
  var url="https://api.github.com/repos/"+CFG.owner+"/"+CFG.repo+"/contents/"+p;
  var h={"Authorization":"Bearer "+CFG.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  var o={method:method,headers:h};
  if(body){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body);}
  return fetch(url,o).then(function(r){
    if(!r.ok)return r.json().then(function(e){throw new Error(e.message||"HTTP "+r.status)});
    return r.json();
  });
}

// ---- Chapter save ----
function forceSave(){
  clearTimeout(saveTimer);
  saveCurChapter();
  var full=packChapters();
  if(!full.trim()){flashBtn("空");return;}
  doSaveExec(full);
}
function flashBtn(txt){
  var btn=document.getElementById("btnSave");
  var orig=btn.textContent;
  btn.textContent=txt;
  setTimeout(function(){btn.textContent=orig;},800);
}
function saveNow(){
  if(savingInProgress)return;
  saveCurChapter();
  var full=packChapters();
  if(!full.trim())return;
  if(full===lastFullContent)return;
  doSaveExec(full);
}
function doSaveExec(full){
  if(savingInProgress)return;
  savingInProgress=true;
  setStatus("保存中...","saving");
  api("GET").then(function(d){
    return doSave(full,d.sha);
  }).catch(function(){
    return doSave(full,null);
  }).then(function(){
    savingInProgress=false;
  }).catch(function(e){
    savingInProgress=false;
    setStatus("保存失败","error");
    console.error("Save error:",e);
  });
}
function doSave(text,sha){
  var body={message:"Update "+CFG.path,content:utf8ToB64(text),branch:CFG.branch};
  if(sha)body.sha=sha;
  return api("PUT",body).then(function(){
    lastFullContent=text;dirty=false;
    setStatus("✓ 已保存","saved");
    setTimeout(function(){setStatus("");},4000);
  }).catch(function(e){
    setStatus("保存失败","error");
    console.error("PUT error:",e);
    throw e;
  });
}

// ---- Chapter load ----
function loadRemote(){
  setStatus("加载中...","saving");
  api("GET").then(function(d){
    var text=b64ToUtf8(d.content.replace(/\n/g,""));
    lastFullContent=text;
    chapters=parseChapters(text);
    chIdx=0;
    if(chapters.length===0)chapters=[{title:"",content:""}];
    var ch0=chapters[0]||{title:"",content:""};
    document.getElementById("chTitleInput").value=ch0.title||"";
    document.getElementById("editor").value=ch0.content||"";
    updateChapterUI();autoResize();updateWordCount();
    setStatus("✓ 已加载","saved");
    setTimeout(function(){setStatus("");},4000);
  }).catch(function(e){
    setStatus("加载失败","error");
    chapters=[{title:"",content:""}];
    chIdx=0;
    document.getElementById("chTitleInput").value="";
    document.getElementById("editor").value="";
    lastFullContent="";
    updateChapterUI();updateWordCount();
    console.error("Load error:",e);
  });
}

// ---- Input handler ----
function onChange(){
  saveCurChapter();
  updateWordCount();
  updateChapterUI();
  dirty=true;
  setStatus("● 未保存","");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){saveNow();},5000);
}

function setStatus(text,cls){
  document.getElementById("saveStatus").textContent=text;
  document.getElementById("saveStatus").className=cls||"";
  document.getElementById("bottomStatus").textContent=text;
  document.getElementById("bottomStatus").className=cls||"";
}
function updateWordCount(){
  var text=document.getElementById("editor").value;
  var cn=(text.match(/[\u4e00-\u9fff]/g)||[]).length;
  var en=(text.match(/[a-zA-Z]+/g)||[]).length;
  document.getElementById("wordCount").textContent=(cn+en)+" 字";
}
function autoResize(){
  var el=document.getElementById("editor");
  el.style.height="auto";
  el.style.height=Math.max(el.scrollHeight,window.innerHeight*0.5)+"px";
}
function toggleTheme(){
  document.body.classList.toggle("dark");
  localStorage.setItem("writer_dark",document.body.classList.contains("dark"));
}

// ---- Note (便签) ----
var isDesktop=false;
var sideExpanded=false;

function toggleNotePanel(){
  var panel=document.getElementById("notePanel");
  panel.classList.toggle("open");
  if(panel.classList.contains("open")){
    loadNotes();
  }
}
function noteTitleEl(){return isDesktop?document.getElementById("sideNoteTitle"):document.getElementById("noteTitle");}
function noteContentEl(){return isDesktop?document.getElementById("sideNoteContent"):document.getElementById("noteContent");}
function saveCurNote(){
  var title=noteTitleEl().value.trim();
  var content=noteContentEl().value;
  if(!notes[noteIdx])notes[noteIdx]={title:"",content:""};
  notes[noteIdx]={title:title,content:content};
}
function renderNoteChips(listId,chipClass){
  var list=document.getElementById(listId);
  var isSide=(listId==="sideNoteList");
  list.innerHTML="";
  for(var i=0;i<notes.length;i++){
    var n=notes[i];
    var chip=document.createElement("div");
    chip.className=chipClass+(i===noteIdx?" active":"");
    chip.textContent=n.title||("便签"+(i+1));
    (function(idx){chip.onclick=function(){if(isSide)switchSideNote(idx);else switchNote(idx);};})(i);
    list.appendChild(chip);
  }
}
function renderNotes(){
  renderNoteChips("noteList","noteChip");
  renderNoteChips("sideNoteList","sideChip");
  if(!notes[noteIdx])notes[noteIdx]={title:"",content:""};
  var n=notes[noteIdx];
  document.getElementById("noteTitle").value=n.title||"";
  document.getElementById("noteContent").value=n.content||"";
  document.getElementById("sideNoteTitle").value=n.title||"";
  document.getElementById("sideNoteContent").value=n.content||"";
  document.getElementById("sideEditor").style.display=sideExpanded?"flex":"none";
}
function switchNote(idx){
  saveCurNote();
  noteIdx=idx;
  renderNotes();
}
function switchSideNote(idx){
  if(sideExpanded&&noteIdx===idx){
    saveCurNote();
    sideExpanded=false;
  }else{
    saveCurNote();
    noteIdx=idx;
    sideExpanded=true;
  }
  renderNotes();
}
function newNote(){
  saveCurNote();
  notes.push({title:"",content:""});
  noteIdx=notes.length-1;
  sideExpanded=true;
  renderNotes();
  noteTitleEl().focus();
}
function deleteNote(){
  if(notes.length<=1){
    notes=[{title:"",content:""}];noteIdx=0;
  }else{
    notes.splice(noteIdx,1);
    if(noteIdx>=notes.length)noteIdx=notes.length-1;
  }
  sideExpanded=true;
  renderNotes();
  onNoteChange();
}
function onNoteChange(){
  saveCurNote();
  setNoteStatus("● 未保存","");
  clearTimeout(noteTimer);
  noteTimer=setTimeout(function(){forceSaveNote();},3000);
}
function setNoteStatus(text,cls){
  var a=document.getElementById("noteSaveStatus");
  a.textContent=text;a.className=cls||"";
  var b=document.getElementById("sideNoteStatus");
  b.textContent=text;b.className=cls||"";
}
function updateDeviceType(){
  // 所有设备统一使用悬浮球 + 全屏便签面板
  isDesktop=false;
  if(notes.length>0)renderNotes();
  document.body.classList.remove("note-desktop");
}
function collapseSidebar(){
  document.body.classList.add("side-collapsed");
  localStorage.setItem("writer_side_collapsed","1");
}
function expandSidebar(){
  document.body.classList.remove("side-collapsed");
  localStorage.setItem("writer_side_collapsed","0");
}

// ---- Quick Input (悬浮快速输入) ----
var editorEverFocused=false;
document.getElementById("editor").addEventListener("focus",function(){editorEverFocused=true;});
function toggleQuickInput(){
  var panel=document.getElementById("quickInputPanel");
  var open=panel.classList.toggle("open");
  if(open){
    var el=document.getElementById("quickInput");
    el.value="";
    setTimeout(function(){el.focus();},50);
  }
}
function submitQuickInput(){
  var el=document.getElementById("quickInput");
  var text=el.value.trim();
  if(!text)return;
  insertParagraph(text);
  el.value="";
  el.focus();
}
function insertParagraph(text){
  var editor=document.getElementById("editor");
  var t=editor.value;
  var pos=t.length;
  if(editorEverFocused){
    try{pos=editor.selectionStart||t.length;}catch(e){pos=t.length;}
  }
  var before=t.substring(0,pos);
  var after=t.substring(pos);
  var lead=before.length&&!before.endsWith("\n")?"\n":"";
  var tail=after.length&&!after.startsWith("\n")?"\n":"";
  editor.value=before+lead+text+tail+after;
  var newPos=pos+lead.length+text.length+tail.length;
  try{editor.selectionStart=editor.selectionEnd=newPos;}catch(e){}
  editor.dispatchEvent(new Event("input",{bubbles:true}));
}
document.getElementById("quickInput").addEventListener("keydown",function(e){
  if(e.key==="Enter"){e.preventDefault();submitQuickInput();}
  else if(e.key==="Escape"){toggleQuickInput();}
});

function forceSaveNote(){
  clearTimeout(noteTimer);
  saveCurNote();
  var json=JSON.stringify(notes);
  if(json===lastNotesContent)return;
  if(noteSaving)return;
  noteSaving=true;
  setNoteStatus("保存中...","saving");
  api("GET",null,NOTES_PATH).then(function(d){
    return putNote(json,d.sha);
  }).catch(function(){
    return putNote(json,null);
  }).then(function(){
    noteSaving=false;
  }).catch(function(e){
    noteSaving=false;
    setNoteStatus("保存失败","error");
    console.error("Note save error:",e);
  });
}
function putNote(json,sha){
  var body={message:"Update notes.md",content:utf8ToB64(json),branch:CFG.branch};
  if(sha)body.sha=sha;
  return api("PUT",body,NOTES_PATH).then(function(){
    lastNotesContent=json;
    setNoteStatus("✓ 已保存","saved");
    setTimeout(function(){setNoteStatus("");},4000);
  }).catch(function(e){
    setNoteStatus("保存失败","error");
    console.error("Note PUT error:",e);
    throw e;
  });
}
function loadNotes(){
  setNoteStatus("加载中...","saving");
  api("GET",null,NOTES_PATH).then(function(d){
    var text=b64ToUtf8(d.content.replace(/\n/g,""));
    try{notes=JSON.parse(text);}catch(e){notes=[];}
    if(!notes.length)notes=[{title:"",content:""}];
    lastNotesContent=JSON.stringify(notes);
    noteIdx=0;
    renderNotes();
    setNoteStatus("✓ 已加载","saved");
    setTimeout(function(){setNoteStatus("");},4000);
  }).catch(function(e){
    notes=[{title:"",content:""}];
    lastNotesContent="[]";
    noteIdx=0;
    renderNotes();
    setNoteStatus("");
    console.error("Note load error:",e);
  });
}

// ---- Init ----
function enterEditor(){
  document.getElementById("loginOverlay").style.display="none";
  document.getElementById("app").style.display="block";
  if(localStorage.getItem("writer_dark")==="true")document.body.classList.add("dark");
  applyFontSize(localStorage.getItem("writer_fontSize")||16);
  if(localStorage.getItem("writer_zoomLock")!=="0")toggleZoomLock();
  updateDeviceType();
  if(localStorage.getItem("writer_side_collapsed")==="1")document.body.classList.add("side-collapsed");
  if(isDesktop)loadNotes();
  loadRemote();
}

// ---- Events ----
document.getElementById("chTitleInput").addEventListener("input",onChange);
document.getElementById("editor").addEventListener("input",function(){onChange();autoResize();});
document.getElementById("fontSlider").addEventListener("input",function(){applyFontSize(this.value);});
document.getElementById("noteTitle").addEventListener("input",onNoteChange);
document.getElementById("noteContent").addEventListener("input",onNoteChange);
document.getElementById("sideNoteTitle").addEventListener("input",onNoteChange);
document.getElementById("sideNoteContent").addEventListener("input",onNoteChange);
window.addEventListener("resize",updateDeviceType);
document.getElementById("btnPrev").addEventListener("click",function(){if(chIdx>0)loadChapter(chIdx-1);});
document.getElementById("btnNext").addEventListener("click",function(){
  if(chIdx<chapters.length-1)loadChapter(chIdx+1);else newChapter();
});
document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault();forceSave();}});
document.addEventListener("click",function(e){
  var pop=document.getElementById("fontPopup");
  if(pop.style.display==="flex"&&!pop.contains(e.target)&&e.target.id!=="btnFont")pop.style.display="none";
});

// ---- Tab 缩进 ----
function handleTab(e){
  if(e.key!=="Tab")return;
  e.preventDefault();
  var el=e.target;
  var start=el.selectionStart;
  var end=el.selectionEnd;
  var indent="\u3000\u3000"; // 2 个全角空格（中文首行缩进）
  el.value=el.value.substring(0,start)+indent+el.value.substring(end);
  el.selectionStart=el.selectionEnd=start+indent.length;
  el.dispatchEvent(new Event("input",{bubbles:true}));
}
document.getElementById("editor").addEventListener("keydown",handleTab);
document.getElementById("noteContent").addEventListener("keydown",handleTab);

// Auto-login
(function(){
  var tok=sessionStorage.getItem("writer_token");
  if(tok){CFG.token=tok;enterEditor();}
})();
