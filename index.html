<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Writer - 云端写作</title>
<style>
:root{
  --bg:#faf9f6; --text:#333; --border:#e0dcd4; --accent:#d4a574;
  --status-bg:#f0ede6; --input-bg:#fff; --shadow:rgba(0,0,0,0.06);
}
.dark{
  --bg:#1e1e1e; --text:#d4d4d4; --border:#3c3c3c; --accent:#c8945a;
  --status-bg:#2a2a2a; --input-bg:#2d2d2d; --shadow:rgba(0,0,0,0.3);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font:16px/1.8 'Georgia','Noto Serif SC',serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}

/* Login overlay */
#loginOverlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
#loginCard{background:var(--input-bg);border:1px solid var(--border);border-radius:12px;padding:36px 28px;width:90%;max-width:360px;text-align:center;box-shadow:0 4px 24px var(--shadow)}
#loginCard h1{font:bold 26px 'Georgia',serif;color:var(--accent);margin-bottom:6px;letter-spacing:2px}
#loginCard p.desc{font-size:13px;color:#999;margin-bottom:24px}
#loginCard input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-size:16px;background:var(--bg);color:var(--text);outline:none;text-align:center;letter-spacing:4px;transition:border .2s}
#loginCard input:focus{border-color:var(--accent)}
#loginCard button{width:100%;padding:11px;margin-top:14px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;font-weight:bold;cursor:pointer;transition:opacity .2s}
#loginCard button:active{opacity:.8}
#loginError{color:#d66;font-size:13px;margin-top:10px;min-height:20px}

/* Editor */
#app{max-width:720px;margin:0 auto;padding:20px 16px 120px;display:none}

#topbar{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:20px}
#topbar button{background:none;border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:4px;font-size:13px;cursor:pointer;transition:all .2s}
#topbar button:hover{border-color:var(--accent);color:var(--accent)}
#saveStatus{font-size:12px;color:#999;margin-left:auto;white-space:nowrap}
#saveStatus.saving{color:#c8945a}
#saveStatus.saved{color:#6a9}
#saveStatus.error{color:#d66}
#wordCount{font-size:12px;color:#999}

#title{width:100%;font:bold 28px/1.4 'Georgia','Noto Serif SC',serif;border:none;outline:none;background:transparent;color:var(--text);padding:8px 0;margin-bottom:16px;resize:none}
#title::placeholder{color:#bbb}

#editor{width:100%;min-height:50vh;border:none;outline:none;background:transparent;color:var(--text);font:16px/1.8 'Georgia','Noto Serif SC',serif;resize:none;overflow-y:hidden}
#editor::placeholder{color:#ccc}

#bottombar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:50}
#bottombar button{flex:1;padding:10px;border:none;border-radius:6px;font-size:15px;cursor:pointer;transition:all .2s;max-width:120px}
#btnSave{background:var(--accent);color:#fff;font-weight:bold}
#btnSave:active{opacity:.8}
#btnLoad{background:var(--border);color:var(--text)}
#btnTheme{background:var(--border);color:var(--text);flex:0;padding:10px 14px;max-width:44px}
#bottomWordCount{font-size:13px;color:#999;margin-left:auto;white-space:nowrap}
#bottomStatus{font-size:12px;color:#999}
#bottomStatus.saving{color:#c8945a}
#bottomStatus.saved{color:#6a9}
#bottomStatus.error{color:#d66}

@media(min-width:768px){
  #bottombar{left:50%;right:auto;transform:translateX(-50%);width:720px;border-radius:8px 8px 0 0;padding:10px 20px;bottom:0}
}

.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>

<!-- Login -->
<div id="loginOverlay">
  <div id="loginCard">
    <h1>Writer</h1>
    <p class="desc">云端写作 · 私人空间</p>
    <input type="password" id="pwInput" placeholder="输入密码" autocomplete="off">
    <button id="loginBtn">进入</button>
    <p id="loginError"></p>
  </div>
</div>

<!-- Editor -->
<div id="app">
  <div id="topbar">
    <span id="saveStatus"></span>
    <span id="wordCount">0 字</span>
  </div>
  <textarea id="title" placeholder="标题..." rows="1"></textarea>
  <textarea id="editor" placeholder="开始写作..." rows="20"></textarea>
</div>

<div id="bottombar">
  <button id="btnTheme" onclick="toggleTheme()">🌓</button>
  <span id="bottomStatus"></span>
  <span id="bottomWordCount">0 字</span>
  <button id="btnLoad" onclick="loadRemote()">☁ 拉取</button>
  <button id="btnSave" onclick="saveNow()">保存</button>
</div>

<script>
// ============================================================
// Encrypted GitHub Token (AES-256-GCM + PBKDF2-SHA256)
// Cannot be read by crawlers — only decryptable with password
// ============================================================
var ENC={salt:"qWqf4hw7OfyWQiS1W1DHHQ==",iv:"L9ADvK1y4kz13L3v",enc:"UhE2Qz3lxTzoyExgy/xCD6VgO1xVrtUAROZFkigPXO8OnKlaVzCkMNALR5igtkXc2UPha3ULKzg=",iter:600000};
var PW_HASH="0a42b8f38c2c1b24ac890f9f72abb8a186160e9a7e909237a84734660154487b";

var CFG={owner:"wangyongshun199910",repo:"writer",branch:"main",path:"novel.md",token:""};
var saveTimer=null,lastContent="",lastTitle="",dirty=false;

// ---- Crypto helpers ----
function b64ToBuf(b64){return Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0)}).buffer}
function bufToHex(buf){return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")}

async function sha256(text){
  var enc=new TextEncoder().encode(text);
  var hash=await crypto.subtle.digest("SHA-256",enc);
  return bufToHex(hash);
}

async function decryptToken(password){
  var salt=b64ToBuf(ENC.salt);
  var iv=b64ToBuf(ENC.iv);
  var ct=b64ToBuf(ENC.enc);
  var pwEnc=new TextEncoder().encode(password);
  var keyMat=await crypto.subtle.importKey("raw",pwEnc,"PBKDF2",false,["deriveBits"]);
  var dk=await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:ENC.iter,hash:"SHA-256"},keyMat,256);
  var aesKey=await crypto.subtle.importKey("raw",dk,"AES-GCM",false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},aesKey,ct);
  return new TextDecoder().decode(pt);
}

// ---- Login ----
async function doLogin(){
  var pw=document.getElementById("pwInput").value;
  if(!pw){showError("请输入密码");return;}
  var hash=await sha256(pw);
  if(hash!==PW_HASH){showError("密码错误");return;}
  try{
    var token=await decryptToken(pw);
    CFG.token=token;
    sessionStorage.setItem("writer_token",token);
    document.getElementById("loginOverlay").style.display="none";
    document.getElementById("app").style.display="block";
    if(localStorage.getItem("writer_dark")==="true")document.body.classList.add("dark");
    updateWordCount();autoResize();
    loadRemote();
  }catch(e){
    showError("解密失败，请重试");
    console.error(e);
  }
}

function showError(msg){
  var el=document.getElementById("loginError");
  el.textContent=msg;
  var card=document.getElementById("loginCard");
  card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake");
}

document.getElementById("loginBtn").addEventListener("click",doLogin);
document.getElementById("pwInput").addEventListener("keydown",function(e){
  if(e.key==="Enter")doLogin();
});

// ---- Auto-login if session exists ----
(function(){
  var tok=sessionStorage.getItem("writer_token");
  if(tok){
    CFG.token=tok;
    document.getElementById("loginOverlay").style.display="none";
    document.getElementById("app").style.display="block";
    if(localStorage.getItem("writer_dark")==="true")document.body.classList.add("dark");
    updateWordCount();autoResize();
    loadRemote();
  }
})();

// ---- GitHub API ----
function api(method,body){
  var url="https://api.github.com/repos/"+CFG.owner+"/"+CFG.repo+"/contents/"+CFG.path;
  var h={"Authorization":"Bearer "+CFG.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  var o={method:method,headers:h};
  if(body){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body);}
  return fetch(url,o).then(function(r){if(!r.ok)return r.json().then(function(e){throw new Error(e.message||"HTTP "+r.status)});return r.json();});
}

function saveNow(){
  var title=document.getElementById("title").value.trim();
  var content=document.getElementById("editor").value;
  if(!title&&!content)return;
  if(title===lastTitle&&content===lastContent)return;
  var text="";if(title)text+="# "+title+"\n\n";text+=content;
  setStatus("保存中...","saving");
  var sha=null;
  api("GET").then(function(d){sha=d.sha;return doSave(text,sha);}).catch(function(){return doSave(text,null);});
}

function doSave(text,sha){
  var body={message:"Update "+CFG.path,content:btoa(unescape(encodeURIComponent(text))),branch:CFG.branch};
  if(sha)body.sha=sha;
  api("PUT",body).then(function(){
    lastContent=document.getElementById("editor").value;
    lastTitle=document.getElementById("title").value;
    dirty=false;
    setStatus("✓ 已保存","saved");
    setTimeout(function(){setStatus("");},4000);
  }).catch(function(e){setStatus("保存失败","error");});
}

function loadRemote(){
  setStatus("加载中...","saving");
  api("GET").then(function(d){
    var text=decodeURIComponent(escape(atob(d.content.replace(/\n/g,""))));
    var title="",content=text;
    var m=text.match(/^#\s+(.+?)\n+/);
    if(m){title=m[1];content=text.substring(m[0].length);}
    document.getElementById("title").value=title;
    document.getElementById("editor").value=content;
    lastTitle=title;lastContent=content;dirty=false;
    autoResize();updateWordCount();
    setStatus("✓ 已加载","saved");
    setTimeout(function(){setStatus("");},4000);
  }).catch(function(e){setStatus("加载失败","error");});
}

function onChange(){
  updateWordCount();dirty=true;
  setStatus("● 未保存","");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    if(!dirty)return;
    saveNow();
  },5000);
}

function setStatus(text,cls){
  var s1=document.getElementById("saveStatus");
  var s2=document.getElementById("bottomStatus");
  s1.textContent=text;s1.className=cls||"";
  s2.textContent=text;s2.className=cls||"";
}
function updateWordCount(){
  var text=document.getElementById("editor").value;
  var cn=(text.match(/[\u4e00-\u9fff]/g)||[]).length;
  var en=(text.match(/[a-zA-Z]+/g)||[]).length;
  var wc=(cn+en)+" 字";
  document.getElementById("wordCount").textContent=wc;
  document.getElementById("bottomWordCount").textContent=wc;
}
function autoResize(){
  var el=document.getElementById("editor");
  el.style.height="auto";
  el.style.height=Math.max(el.scrollHeight,window.innerHeight*0.5)+"px";
}
function toggleTheme(){
  document.body.classList.toggle("dark");
  localStorage.setItem("writer_dark",document.body.classList.contains("dark"));
}

document.getElementById("title").addEventListener("input",onChange);
document.getElementById("editor").addEventListener("input",function(){onChange();autoResize();});
document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault();saveNow();}});
</script>
</body>
</html>
